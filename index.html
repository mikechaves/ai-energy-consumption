<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Energy Consumption Visualization</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Include A-Frame -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <!-- Include D3.js -->
    <script src="https://d3js.org/d3.v6.min.js"></script>
    <!-- Include A-Frame Stars Component -->
    <script src="https://unpkg.com/aframe-stars-component/dist/aframe-stars-component.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; }
        /* Styles for UI controls */
        #controls {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 999;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px;
            border-radius: 5px;
        }
        #controls label {
            margin-right: 5px;
        }
        #controls select {
            margin-bottom: 10px;
        }
        /* Styles for the tooltip */
        #tooltip {
            position: absolute;
            display: none;
            padding: 8px;
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            border-radius: 4px;
            pointer-events: none;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <!-- User Interface Controls -->
    <div id="controls">
        <!-- Your existing controls -->
        <label for="dataTypeSelect">Data Type:</label>
        <select id="dataTypeSelect">
            <option value="energyConsumed">Energy Consumption</option>
            <option value="co2Emissions">CO₂ Emissions</option>
        </select><br/>
        <label for="regionSelect">Region:</label>
        <select id="regionSelect">
            <option value="All">All Regions</option>
            <option value="Africa">Africa</option>
            <option value="Asia">Asia</option>
            <option value="Europe">Europe</option>
            <option value="North America">North America</option>
            <option value="South America">South America</option>
            <option value="Oceania">Oceania</option>
        </select>
    </div>
    <!-- Tooltip for displaying data details -->
    <div id="tooltip"></div>
    <!-- A-Frame Scene -->
    <a-scene background="color: black">
        <!-- Preload Assets -->
        <a-assets>
            <img id="earthTexture" src="assets/earth_texture.jpg" crossorigin="anonymous" />
            <img id="starfieldTexture" src="assets/starfield_texture.jpg" crossorigin="anonymous" />
        </a-assets>

        <!-- Sky with Starfield Texture -->
        <a-sky src="#starfieldTexture"></a-sky>

        <!-- Sky Background -->
        <!-- <a-sky color="#000000"></a-sky> -->

        <!-- Starfield -->
        <!-- <a-entity stars="count: 5000; depth: 1000; size: 1; color: #FFFFFF"></a-entity> -->

        <!-- Rotating Globe with Earth Texture -->
        <a-entity id="globe" rotation="0 0 0">
            <a-sphere radius="3" position="0 2 -10" src="#earthTexture"></a-sphere>
        </a-entity>

        <!-- Camera with Look Controls and WASD Controls -->
        <a-entity id="cameraRig" position="0 2 5">
            <a-entity camera look-controls wasd-controls></a-entity>
        </a-entity>

        <!-- Cursor Entity for Mouse Events -->
        <a-entity cursor="rayOrigin: mouse"></a-entity>
    </a-scene>
    <!-- Include the JavaScript file -->
    <script src="js/ai_energy_consumption_prototype.js"></script>
</body>
</html>
